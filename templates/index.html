<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lihan Web Music Player</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="player">
    <h1>Lihan Web Music Player</h1>
    <audio id="audio" controls preload="metadata"></audio>

    <div class="controls">
      <button onclick="prevSong()" title="Previous">Prev</button>
      <button onclick="togglePlay()" id="playBtn" title="Play/Pause">Play</button>
      <button onclick="nextSong()" title="Next">Next</button>

      <select id="mode" onchange="changeMode(this.value)">
        <option value="order">Order</option>
        <option value="single">Single</option>
        <option value="shuffle">Shuffle</option>
      </select>

      <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </div>

    <ul id="playlist" class="playlist"></ul>
  </div>

  <div id="lyrics" class="lyrics"></div>

  <script>
    const audio = document.getElementById("audio");
    const playlist = document.getElementById("playlist");
    const lyricsBox = document.getElementById("lyrics");
    const playBtn = document.getElementById("playBtn");

    let songs = [];
    let current = 0;
    let mode = "order";
    let lyrics = [];
    let currentItem = null;

    async function loadSongs() {
      const res = await fetch("api/songs");
      songs = await res.json();
      playlist.innerHTML = "";
      songs.forEach((song, index) => {
        const item = document.createElement("li");
        item.textContent = song.title;
        item.onclick = () => playSong(index);
        playlist.appendChild(item);
      });
      if (songs.length > 0) {
        await playSong(0, false);
      } else {
        lyricsBox.textContent = "No music found. Check MUSIC_DIR.";
      }
    }

    async function playSong(index, autoplay = true) {
      current = index;
      audio.src = songs[current].file;
      await loadLyrics(songs[current].lrc);
      if (autoplay) {
        await audio.play();
      }
      playBtn.textContent = audio.paused ? "Play" : "Pause";

      if (currentItem) currentItem.classList.remove("active");
      const nextItem = playlist.children[current];
      if (nextItem) {
        nextItem.classList.add("active");
        nextItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
        currentItem = nextItem;
      }
    }

    async function loadLyrics(url) {
      try {
        const res = await fetch(url);
        const text = await res.text();
        lyrics = parseLRC(text);
      } catch {
        lyrics = [];
      }
    }

    function parseLRC(text) {
      const lines = text.split("\n");
      const result = [];
      const regex = /\[(\d+):(\d+)(?:\.(\d+))?\](.*)/;
      lines.forEach((line) => {
        const match = regex.exec(line);
        if (match) {
          const time = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
          result.push({ time, text: match[4].trim() });
        }
      });
      return result;
    }

    audio.ontimeupdate = () => {
      const time = Math.floor(audio.currentTime);
      const line = lyrics.findLast((item) => item.time <= time);
      if (line) lyricsBox.textContent = line.text;
    };

    audio.onplay = () => playBtn.textContent = "Pause";
    audio.onpause = () => playBtn.textContent = "Play";
    audio.onended = () => {
      if (mode === "order") nextSong();
      else if (mode === "single") playSong(current);
      else if (mode === "shuffle") playSong(Math.floor(Math.random() * songs.length));
    };

    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
    function prevSong() { if (songs.length) playSong((current - 1 + songs.length) % songs.length); }
    function nextSong() { if (songs.length) playSong((current + 1) % songs.length); }
    function changeMode(nextMode) { mode = nextMode; }

    document.getElementById("volume").oninput = (event) => audio.volume = event.target.value;
    loadSongs();
  </script>
</body>
</html>
